name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      COREUTILS: '9.11'

    steps:
      - uses: actions/checkout@v4

      # le ls d'ubuntu est en 9.4, plus vieux que le source suivi dans
      # docs/reference : --sort=name n'existe pas encore et -f y desactive
      # encore -l et -s. on compare donc contre la version de reference.
      - name: Cache du ls de reference
        id: cache-ls
        uses: actions/cache@v4
        with:
          path: ~/gnu-ls
          key: coreutils-${{ env.COREUTILS }}-${{ runner.os }}

      - name: Construction de GNU ls ${{ env.COREUTILS }}
        if: steps.cache-ls.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://ftp.gnu.org/gnu/coreutils/coreutils-$COREUTILS.tar.xz
          tar xf coreutils-$COREUTILS.tar.xz
          cd coreutils-$COREUTILS
          ./configure --quiet
          make -j"$(nproc)" src/ls || make -j"$(nproc)"
          mkdir -p ~/gnu-ls
          cp src/ls ~/gnu-ls/ls

      - name: Version de reference
        run: ~/gnu-ls/ls --version | head -1

      - name: Compilation
        run: make

      - name: Suite de comparaison contre GNU ls
        run: make test
        env:
          GNU_LS: /home/runner/gnu-ls/ls

  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Compilation
        run: make CC=${{ matrix.cc }}

      - name: Le binaire existe et est executable
        run: test -x ./ft_ls

      - name: Pas de relink inutile
        run: |
          out=$(make CC=${{ matrix.cc }})
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qiE 'compiling|building'; then
            echo "::error::make recompile alors que rien n'a change"
            exit 1
          fi

      - name: make clean supprime les objets mais garde le binaire
        run: |
          make clean
          test ! -d .build
          test -x ./ft_ls

      - name: make fclean supprime tout
        run: |
          make fclean
          test ! -d .build
          test ! -e ./ft_ls

      - name: make re reconstruit depuis zero
        run: |
          make re CC=${{ matrix.cc }}
          test -x ./ft_ls

      - name: fclean laisse le depot propre
        run: |
          make fclean
          git status --porcelain > /tmp/dirty
          if [ -s /tmp/dirty ]; then
            echo "::error::des fichiers non suivis subsistent apres fclean"
            cat /tmp/dirty
            exit 1
          fi
